name: Relay

on:
  push:
    branches: ["master"]
    paths: ["relay/**", ".github/workflows/relay.yml"]
  pull_request:
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

jobs:
  relay:
    name: 'Test and deploy the Cloudflare relay'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Protocol test against a local relay
        run: |
          { node scripts/vapid.mjs; echo PUSH_ALLOW_LOOPBACK=1; } > .dev.vars
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8787/ && break; sleep 1; done
          npm test

      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && env.HAS_TOKEN == 'true'
        run: |
          npx wrangler deploy
          if ! npx wrangler secret list | grep -q VAPID_PRIVATE_KEY; then
            node scripts/vapid.mjs json > "$RUNNER_TEMP/vapid.json"
            npx wrangler secret bulk "$RUNNER_TEMP/vapid.json"
            rm "$RUNNER_TEMP/vapid.json"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
