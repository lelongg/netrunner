name: Policy grid

on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Games per cell and split'
        default: '6'
      splits:
        description: 'Seed splits, space separated'
        default: 'design test'
      configs:
        description: 'JSON list of {name, flags} to compare'
        default: '[{"name":"base","flags":""},{"name":"search","flags":"--search 1"}]'
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write

jobs:
  engine:
    name: 'Compile the engine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiled engine
        id: engine
        uses: actions/cache@v4
        with:
          path: mobile/engine/engine.js
          key: engine-${{ hashFiles('src/clj/**', 'src/cljc/**', 'src/cljs/**', 'shadow-cljs.edn', 'project.clj', 'package-lock.json') }}

      - uses: actions/setup-node@v4
        if: steps.engine.outputs.cache-hit != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prepare java
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install clojure tools
        if: steps.engine.outputs.cache-hit != 'true'
        uses: DeLaGuardo/setup-clojure@94d767dbb80ae5c637d0f1ad70b75fa2b00495cd # 13.0
        with:
          lein: 2.9.1

      - name: Cache lein project dependencies
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.lein
          key: ${{ runner.os }}-mobile-clojure-${{ hashFiles('**/project.clj') }}
          restore-keys: ${{ runner.os }}-mobile-clojure

      - name: Compile the engine to JavaScript
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          npm ci
          npx shadow-cljs release engine

      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: mobile/engine/engine.js
          retention-days: 3

  plan:
    name: 'Plan the cells'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      games: ${{ steps.plan.outputs.games }}
      splits: ${{ steps.plan.outputs.splits }}
    steps:
      - id: plan
        env:
          CONFIGS: ${{ inputs.configs }}
          GAMES: ${{ inputs.games }}
          SPLITS: ${{ inputs.splits }}
        run: |
          node -e '
            const configs = JSON.parse(process.env.CONFIGS || "[{\"name\":\"base\",\"flags\":\"\"},{\"name\":\"search\",\"flags\":\"--search 1\"}]");
            const corps = ["core-hb", "core-jinteki", "core-nbn", "core-weyland"];
            const runners = ["core-anarch", "core-criminal", "core-shaper"];
            const include = [];
            for (const c of configs) for (const corp of corps) for (const runner of runners) include.push({ config: c.name, flags: c.flags, corp, runner });
            console.log("matrix=" + JSON.stringify({ include }));
            console.log("games=" + (process.env.GAMES || "6"));
            console.log("splits=" + (process.env.SPLITS || "design test"));
          ' >> "$GITHUB_OUTPUT"

  cells:
    name: '${{ matrix.config }} · ${{ matrix.corp }} vs ${{ matrix.runner }}'
    needs: [engine, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install npm dependencies
        run: npm ci --prefix mobile

      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: mobile/engine

      - name: Fetch card data
        run: npm run cards --prefix mobile

      - name: Play the cell
        working-directory: mobile
        env:
          FLAGS: ${{ matrix.flags }}
          CONFIG: ${{ matrix.config }}
          CORP: ${{ matrix.corp }}
          RUNNER: ${{ matrix.runner }}
        run: |
          mkdir -p results
          for split in ${{ needs.plan.outputs.splits }}; do
            node --experimental-strip-types scripts/policy-eval.mjs --games ${{ needs.plan.outputs.games }} --corp policy --runner ref --split $split --corp-deck ${{ matrix.corp }} --runner-deck ${{ matrix.runner }} $FLAGS --out results/$split > results/$split.log 2>&1 &
          done
          wait
          for split in ${{ needs.plan.outputs.splits }}; do
            grep -E "games in|decision avg|mistakes over" results/$split.log
            node -e '
              const fs = require("fs");
              const split = process.argv[1];
              const log = fs.readFileSync(`results/${split}.log`, "utf8");
              const summary = JSON.parse(fs.readFileSync(`results/${split}/summary.json`, "utf8"));
              const ms = log.match(/corp: decision avg ([0-9.]+)ms max ([0-9.]+)ms/);
              fs.writeFileSync(`results/${split}/cell.json`, JSON.stringify({ config: process.env.CONFIG, flags: process.env.FLAGS, corp: process.env.CORP, runner: process.env.RUNNER, split, games: summary.games, wins: summary.wins, reasons: summary.reasons, mistakes: summary.mistakes, decisionMs: ms ? Number(ms[1]) : null, decisionMaxMs: ms ? Number(ms[2]) : null }));
            ' $split
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.config }}-${{ matrix.corp }}-${{ matrix.runner }}
          path: |
            mobile/results/*/cell.json
            mobile/results/*/summary.json
            mobile/results/*/situations.jsonl
            mobile/results/*.log
          retention-days: 30

  report:
    name: 'Assemble the grids'
    needs: [plan, cells]
    if: always() && needs.cells.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          pattern: cell-*
          path: cells

      - name: Build the report
        run: |
          node mobile/scripts/grid-report.mjs cells report.md report.json
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the report on the eval-results branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stamp=$(date -u +%Y-%m-%d-%H%M)
          mkdir rb && cd rb
          git init -q
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin eval-results; then git checkout -q eval-results; else git checkout -q --orphan eval-results; fi
          mkdir -p grids
          cp ../report.md "grids/${stamp}-${GITHUB_RUN_ID}.md"
          cp ../report.json "grids/${stamp}-${GITHUB_RUN_ID}.json"
          cp ../report.md grids/latest.md
          cp ../report.json grids/latest.json
          git add -A
          git -c user.name='policy-grid' -c user.email='policy-grid@users.noreply.github.com' commit -q -m "Grid ${stamp} (run ${GITHUB_RUN_ID}, ${GITHUB_SHA:0:9})"
          git push -q origin eval-results
          echo "Report: https://github.com/${GITHUB_REPOSITORY}/blob/eval-results/grids/${stamp}-${GITHUB_RUN_ID}.md" >> "$GITHUB_STEP_SUMMARY"
