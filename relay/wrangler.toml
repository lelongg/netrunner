name = "netrunner-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "REPLAYS"
class_name = "ReplayStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ReplayStore"]

[[d1_databases]]
binding = "DECKS"
database_name = "netrunner-decklists"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "decklists-migrations"

[vars]
EXPIRY_DAYS = "14"
ALLOWED_ORIGINS = "https://lelongg.github.io,http://localhost:5173,http://localhost:4178"

[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "CREATE_LIMIT_ALL"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "REPLAY_LIMIT"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "REPLAY_LIMIT_ALL"
namespace_id = "1005"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "WATCH_LIMIT"
namespace_id = "1006"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "DECK_LIMIT"
namespace_id = "1007"
simple = { limit = 60, period = 60 }
