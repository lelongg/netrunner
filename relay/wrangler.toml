name = "netrunner-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[vars]
EXPIRY_DAYS = "14"
ALLOWED_ORIGINS = "https://lelongg.github.io,http://localhost:5173,http://localhost:4178"

[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "CREATE_LIMIT_ALL"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
